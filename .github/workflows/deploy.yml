name: CMS Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, ctype, xml, dom, curl, bcmath, tokenizer, openssl, fileinfo
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Backup .env on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            APP_DIR="/home/${{ secrets.SSH_USERNAME }}/CMS"
            mkdir -p "$APP_DIR"
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" "$APP_DIR/.env.production.backup"
              echo "✅ .env backed up"
            else
              echo "⚠️ No .env found to backup"
            fi

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Application Files
        run: |
          cat > /tmp/rsync-exclude.txt << 'EOF'
          # Version control & CI
          .git/
          .github/
          .gitattributes
          .gitignore

          # Local/dev tooling
          .cursor/
          .claude/
          .ai/
          .codex/
          .editorconfig
          .mcp.json
          .npmrc
          .phpunit.cache/
          .phpunit.result.cache
          .scpignore
          Toolnized_cms/
          node_modules/
          tests/
          phpunit.xml
          vite.config.js
          package.json
          package-lock.json

          # Docs
          *.md

          # Environment (never overwrite production secrets)
          .env
          .env.backup
          .env.production
          .env.production.backup

          # Server-managed runtime data (protected from --delete)
          storage/app/
          storage/framework/cache/
          storage/framework/sessions/
          storage/framework/views/
          storage/logs/
          bootstrap/cache/
          public/storage
          public/hot
          EOF

          rsync -avz --delete \
            --exclude-from=/tmp/rsync-exclude.txt \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USERNAME }}/CMS/

      - name: Run Post-Deployment Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.SSH_USERNAME }}/CMS"
            cd "$APP_DIR"

            echo "✅ Working directory: $(pwd)"

            # Restore .env if missing
            if [ ! -f .env ]; then
              echo "⚠️ .env missing — restoring backup..."
              if [ -f .env.production.backup ]; then
                cp .env.production.backup .env
              else
                echo "❌ No .env backup found. Aborting."
                exit 1
              fi
            fi

            # Ensure writable directories exist
            mkdir -p storage/framework/{cache/data,sessions,views}
            mkdir -p storage/logs
            mkdir -p storage/app/public
            mkdir -p bootstrap/cache

            # Permissions for shared hosting
            chmod -R ug+rwx storage bootstrap/cache

            # Storage symlink for uploaded images
            php artisan storage:link --force

            # Clear stale caches before migrations
            php artisan optimize:clear

            # Database
            php artisan migrate --force

            # Rebuild production caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "✅ CMS deployed successfully!"

      - name: Notify on Success
        if: success()
        run: echo "✅ CMS deployed successfully via SSH!"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Deployment failed! Check GitHub Actions logs for details."
